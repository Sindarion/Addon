<p-table
    [value]="taskList"
    [paginator]="true"
    [rows]="5"
    [lazy]="true"
    [rowsPerPageOptions]="[5, 10, 20]"
>
    <ng-template #header>
        <tr>
            <th class="p-4">Description</th>
            <th>Priority</th>
            <th>Status</th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template #body let-task>
        <tr>
            <td>{{ task.description }}</td>
            <td>{{ task.priority }}</td>
            <td>{{ task.status }}</td>
            <td>
                <button pButton type="button" icon="pi pi-ellipsis-v"></button>
            </td>
        </tr>
    </ng-template>
</p-table>
